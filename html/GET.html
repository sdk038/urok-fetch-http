<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GET-запрос — пример</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      padding: 30px;
    }
    h1 {
      color: #333;
    }
    button {
      padding: 10px 20px;
      border: none;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h1>Пример GET-запроса с fetch()</h1>
  <p>Нажми на кнопку, чтобы получить список постов с сервера 👇</p>

  <button id="loadData">Загрузить данные</button>

  <div class="result" id="result"></div>

  <script src="../js/GET.js"></script>
</body>
</html>
