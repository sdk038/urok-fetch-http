<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>POST-запрос — пример</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        pre {
            white-space: pre-wrap;
        }
    </style>


</head>
<body>

<h1>Пример POST-запроса</h1>
<p>Заполни форму и отправь данные на сервер:</p>

<label>Заголовок поста:</label>
<input type="text" id="title" placeholder="Введите заголовок">

<label>Текст поста:</label>
<textarea id="body" rows="5" placeholder="Введите текст поста"></textarea>

<button id="sendBtn">Отправить пост</button>

<div class="result" id="result"></div>

<script src='../js/POST.js'></script>
</body>
</html>
